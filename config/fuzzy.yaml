# منطق فازی v1 — نگاشت وضعیت NDS به bias (به سمت LONG) و وزن تایم‌فریم‌ها
# این مقادیر در فاز 5 با دیتای ژورنال کالیبره می‌شوند؛ فعلا مقادیر اولیه.

state_bias:
  rally_up: 0.70     # رالی صعودی
  flag_pos: 0.60     # فلگ مثبت
  flag_neg: 0.40     # فلگ منفی
  rally_down: 0.30   # رالی نزولی
  unknown: 0.50

tf_weights:
  "1440": 0.35   # روزانه
  "240": 0.30    # 4 ساعته
  "30": 0.20     # 30 دقیقه
  "10": 0.15     # 10 دقیقه
